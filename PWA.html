<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a9e7e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Soins Infirmiers</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#0f1923;--bg2:#16232f;--bg3:#1e2f3d;--card:#1a2a38;
  --accent:#1a9e7e;--accent2:#22c4a0;--accent-dim:rgba(26,158,126,0.15);
  --red:#e05252;--amber:#e0a832;--blue:#4a9edd;--pink:#d45ead;
  --text:#e8f0f5;--text2:#8aa0b0;--text3:#4d6070;
  --border:rgba(255,255,255,0.07);--radius:16px;--radius-sm:10px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--border);min-height:60px;flex-shrink:0;z-index:10;gap:8px}
.topbar-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:10px;cursor:pointer;font-size:18px;flex-shrink:0}
.topbar-back:active{background:var(--accent-dim)}
.topbar-center{flex:1;text-align:center;min-width:0}
.topbar-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:11px;color:var(--text2);margin-top:1px}
.topbar-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.tbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:16px;border:none;font-family:var(--font)}
.tbtn.accent{background:var(--accent)}
.tbtn.ghost{background:var(--bg3);color:var(--text2)}
.tbtn:active{opacity:0.7}
.topbar-placeholder{width:36px;flex-shrink:0}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:15px;padding:11px 11px 11px 38px;outline:none}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent)}

/* STATS */
.stats-bar{display:flex;gap:8px;margin-bottom:14px}
.stat-chip{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;text-align:center}
.stat-chip .val{font-size:20px;font-weight:600;color:var(--accent2);font-family:var(--mono)}
.stat-chip .lbl{font-size:10px;color:var(--text2);margin-top:1px}

.section-label{font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--text3);text-transform:uppercase;margin-bottom:8px}

/* PATIENT LIST */
.patient-list{display:flex;flex-direction:column;gap:7px}
.couple-group{display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(212,94,173,0.3);background:rgba(212,94,173,0.03)}
.couple-label{padding:6px 14px;font-size:10px;font-weight:600;color:var(--pink);letter-spacing:0.06em;text-transform:uppercase;border-bottom:1px solid rgba(212,94,173,0.12)}
.couple-group .patient-card{border-radius:0;border:none;border-bottom:1px solid rgba(255,255,255,0.04)}
.couple-group .patient-card:last-child{border-bottom:none}
.patient-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform 0.1s;position:relative;overflow:hidden}
.patient-card:active{transform:scale(0.985)}
.patient-card.urgent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.patient-card.seen-today{border-color:rgba(26,158,126,0.25)}
.patient-avatar{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0}
.patient-info{flex:1;min-width:0}
.patient-name{font-size:14px;font-weight:600}
.patient-meta{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.badge-ok{background:rgba(26,158,126,0.15);color:var(--accent2)}
.badge-alert{background:rgba(224,82,82,0.15);color:var(--red)}

/* DOSSIER */
.patient-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.ph-top{display:flex;align-items:flex-start;gap:12px}
.patient-avatar-lg{width:56px;height:56px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;flex-shrink:0}
.ph-info h2{font-size:18px;font-weight:600}
.ph-info p{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.5}
.patient-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.tag.couple{border-color:rgba(212,94,173,0.4);color:var(--pink);background:rgba(212,94,173,0.08)}

/* VU BUTTON */
.vu-bar{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);align-items:center}
.vu-btn{flex:1;padding:11px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px}
.vu-btn.not-seen{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.vu-btn.is-seen{background:rgba(26,158,126,0.15);color:var(--accent2);border:1px solid rgba(26,158,126,0.3)}
.vu-btn:active{opacity:0.7;transform:scale(0.98)}
.header-actions{display:flex;gap:7px;margin-top:10px}
.btn-sm{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--font)}
.btn-sm:active{opacity:0.7}
.btn-sm.danger{border-color:rgba(224,82,82,0.3);color:var(--red);background:rgba(224,82,82,0.08)}
.btn-sm.primary{border-color:var(--accent);color:var(--accent2);background:var(--accent-dim)}

/* DOCS */
.docs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.doc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:transform 0.1s;display:flex;flex-direction:column;gap:5px}
.doc-card:active{transform:scale(0.97)}
.doc-card.add-doc{border-style:dashed;align-items:center;justify-content:center;min-height:84px;gap:4px}
.doc-icon{font-size:20px}
.doc-name{font-size:12px;font-weight:500}
.doc-datetime{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

/* ID DOCS */
.id-docs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.id-doc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-height:90px;justify-content:center;transition:transform 0.1s}
.id-doc-card:active{transform:scale(0.97)}
.id-doc-card.has-photo{border-color:rgba(26,158,126,0.3);background:rgba(26,158,126,0.04)}
.id-doc-card .id-icon{font-size:26px}
.id-doc-card .id-label{font-size:12px;font-weight:500;color:var(--text)}
.id-doc-card .id-status{font-size:10px;color:var(--text3)}
.id-doc-card.has-photo .id-status{color:var(--accent2)}

/* CONTACTS */
.contact-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.contact-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.contact-name{font-size:14px;font-weight:600}
.contact-role{font-size:11px;color:var(--text3);margin-top:1px}
.contact-actions{display:flex;gap:5px;flex-wrap:wrap}
.contact-btn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--font);text-decoration:none;white-space:nowrap}
.contact-btn:active{opacity:0.7}
.contact-btn.tel{border-color:rgba(26,158,126,0.3);color:var(--accent2);background:rgba(26,158,126,0.07)}
.contact-btn.mail{border-color:rgba(74,158,221,0.3);color:var(--blue);background:rgba(74,158,221,0.07)}
.add-contact-btn{width:100%;padding:11px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font)}

/* FORMULAIRES */
.form-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.form-title{font-size:15px;font-weight:600}
.form-patient{font-size:12px;color:var(--accent2);margin-top:3px}
.form-section{margin-bottom:18px}
.form-section-title{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.field-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.field-row{display:flex;align-items:center;padding:11px 14px;gap:10px;border-bottom:1px solid var(--border)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:13px;color:var(--text2);flex:1}
.field-input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:14px;text-align:right;width:100px}
.field-unit{font-size:11px;color:var(--text3);white-space:nowrap}
.field-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:14px;padding:12px;outline:none;resize:none;min-height:90px;line-height:1.6}
.field-textarea:focus{border-color:var(--accent)}

/* TABLEAU MESURES */
.measure-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;width:100%}
.measure-table{border-collapse:collapse;display:block;overflow-x:auto}
.mt-head,.mt-row{display:grid;border-bottom:1px solid var(--border)}
.mt-row:last-child{border-bottom:none}
.mt-cell{padding:8px 6px;font-size:11px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.mt-cell:last-child{border-right:none}
.mt-cell.hdr{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;background:var(--bg3)}
.mt-cell input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12px;width:100%;text-align:center;min-width:0}
.mt-cell .dt-display{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:center;line-height:1.4;white-space:nowrap}

/* tension: date | heure | sys | dia | pouls */
.mt-tension{grid-template-columns:72px 56px 52px 52px 52px}
/* glycemie: date | heure | avant | après */
.mt-glyc{grid-template-columns:72px 56px 1fr 1fr}

.photo-zone{background:var(--card);border:2px dashed var(--border);border-radius:var(--radius-sm);padding:26px;text-align:center;cursor:pointer}
.photo-zone:active{border-color:var(--accent)}
.photo-zone-icon{font-size:30px;margin-bottom:7px}
.photo-zone-text{font-size:13px;color:var(--text2)}
.photo-zone-sub{font-size:11px;color:var(--text3);margin-top:3px}

.save-btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:white;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;margin-bottom:28px}
.save-btn:active{opacity:0.8}
.save-btn.ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

.modele-grid{display:flex;flex-direction:column;gap:8px}
.modele-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform 0.1s}
.modele-item:active{transform:scale(0.98)}
.modele-icon{font-size:24px;width:38px;text-align:center;flex-shrink:0}
.modele-info h3{font-size:14px;font-weight:600}
.modele-info p{font-size:11px;color:var(--text2);margin-top:2px}
.modele-arrow{color:var(--text3);font-size:17px;margin-left:auto}

/* EXPORT/IMPORT */
.data-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.data-panel h3{font-size:14px;font-weight:600;margin-bottom:4px}
.data-panel p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.data-panel-btns{display:flex;flex-direction:column;gap:8px}
.data-btn{width:100%;padding:13px 16px;border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:all 0.15s}
.data-btn:active{opacity:0.7}
.data-btn.export-btn{background:var(--accent-dim);border-color:rgba(26,158,126,0.3);color:var(--accent2)}
.data-btn.import-btn{background:rgba(74,158,221,0.08);border-color:rgba(74,158,221,0.3);color:var(--blue)}
.data-btn.danger-btn{background:rgba(224,82,82,0.07);border-color:rgba(224,82,82,0.25);color:var(--red)}
.data-btn-icon{font-size:18px}
.data-btn-text{}
.data-btn-text strong{display:block;font-size:13px;font-weight:600}
.data-btn-text span{font-size:11px;opacity:0.8}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:white;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:500;opacity:0;transition:all 0.3s;z-index:200;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:150;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;padding:20px}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:310px;transform:scale(0.92);transition:transform 0.2s}
.confirm-overlay.open .confirm-box{transform:scale(1)}
.confirm-title{font-size:16px;font-weight:600;margin-bottom:7px}
.confirm-msg{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;padding:12px;border-radius:9px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border)}
.confirm-cancel{background:var(--bg3);color:var(--text2)}
.confirm-ok{background:var(--red);color:white;border-color:var(--red)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{width:100%;background:var(--bg2);border-radius:22px 22px 0 0;padding:8px 18px 36px;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:92dvh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 18px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px}
.modal-field{margin-bottom:12px}
.modal-field label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;display:block;margin-bottom:5px}
.modal-input,.modal-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:14px;padding:12px 13px;outline:none;appearance:none}
.modal-input:focus{border-color:var(--accent)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btn{width:100%;padding:14px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:white;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.couple-note{font-size:11px;color:var(--pink);margin-top:5px;padding:7px 11px;background:rgba(212,94,173,0.08);border-radius:7px;border:1px solid rgba(212,94,173,0.2)}
.datetime-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 11px;outline:none;margin-top:5px}
.datetime-input:focus{border-color:var(--accent)}

/* CATÉGORIES PATIENTS */
.cat-toggle{display:flex;gap:6px;margin-bottom:14px}
.cat-btn{flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-family:var(--font);transition:all 0.15s;text-align:center}
.cat-btn.active{background:var(--accent-dim);border-color:rgba(26,158,126,0.4);color:var(--accent2)}
.cat-btn:active{opacity:0.7}
.badge-archive{background:rgba(77,96,112,0.3);color:var(--text3)}

/* COMMENTAIRE TENSION */
.tension-comment-row{grid-column:1/-1;padding:0 6px 8px;display:flex;align-items:center;gap:6px}
.tension-comment-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;color:var(--text2);font-family:var(--font);font-size:11px;padding:4px 2px;width:100%}
.tension-comment-input::placeholder{color:var(--text3)}
.tension-comment-input:focus{border-color:var(--accent)}
.add-comment-btn{width:22px;height:22px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.add-comment-btn:active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent2)}

/* PDF PRINT */
@media print{
  #app, .no-print, .topbar, .vu-bar, .header-actions, .save-btn, .add-contact-btn {display:none!important}
  body{background:white!important;color:#111!important;padding:0!important;margin:0!important}
  #pdf-overlay{position:static!important;display:block!important;background:white!important;padding:0!important;overflow:visible!important}
  .pdf-page{box-shadow:none!important;margin:0!important;border:none!important;width:100%!important;max-width:none!important;padding:20px!important}
}
#pdf-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px}
#pdf-overlay.open{display:flex}
.pdf-page{background:white;color:#111;width:100%;max-width:680px;border-radius:12px;padding:40px;font-family:'DM Sans',Arial,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.pdf-header{text-align:center;border-bottom:2px solid #1a9e7e;padding-bottom:20px;margin-bottom:24px}
.pdf-title{font-size:22px;font-weight:700;color:#0f1923;letter-spacing:0.02em}
.pdf-subtitle{font-size:13px;color:#666;margin-top:6px}
.pdf-patient{font-size:15px;font-weight:600;color:#1a9e7e;margin-top:8px}
.pdf-dates{font-size:12px;color:#888;margin-top:3px;font-family:'DM Mono',monospace}
.pdf-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.pdf-table th{background:#f0faf7;color:#1a9e7e;padding:8px 10px;text-align:left;font-weight:600;border:1px solid #d0ede6;font-size:11px;text-transform:uppercase;letter-spacing:0.05em}

<script>
// ═══════════════════════════════════════════════
// CONSTANTES & ÉTAT
// ═══════════════════════════════════════════════
const COLORS=['#1a9e7e','#4a9edd','#e0a832','#e05252','#9b7de0','#e07a5f'];
const VERSION='2.0';
const DB_NAME = 'SoinsMobileDB';
const DB_VERSION = 1;

let db;

// INITIALISATION INDEXEDDB
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('patients')) db.createObjectStore('patients', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
    request.onerror = () => reject('DB error');
  });
}

async function dbSave(store, data) {
  const tx = db.transaction(store, 'readwrite');
  return new Promise(r => { tx.objectStore(store).put(data).onsuccess = () => r(); });
}

async function dbGetAll(store) {
  const tx = db.transaction(store, 'readonly');
  return new Promise(r => { tx.objectStore(store).getAll().onsuccess = (e) => r(e.target.result); });
}

async function dbGet(store, id) {
  const tx = db.transaction(store, 'readonly');
  return new Promise(r => { tx.objectStore(store).get(id).onsuccess = (e) => r(e.target.result); });
}

async function dbDelete(store, id) {
  const tx = db.transaction(store, 'readwrite');
  return new Promise(r => { tx.objectStore(store).delete(id).onsuccess = () => r(); });
}

const ID_DOCS=[
  {key:'carte_vitale',icon:'💳',label:'Carte vitale'},
  {key:'cni',icon:'🪪',label:'Carte d\'identité'},
  {key:'mutuelle',icon:'🏥',label:'Carte mutuelle'},
];

let S={
  page:'login', patientId:null, docId:null, search:'',
  editPid:null, contactPid:null, category:'active',
  currentUser: null,
  patients: []
};

async function startApp() {
  try {
    await initDB();
    S.patients = await dbGetAll('patients');
    
    // Migration localStorage
    if(S.patients.length === 0) {
      const old = localStorage.getItem('sm_v16') || localStorage.getItem('sm_v15');
      if(old) {
        const parsed = JSON.parse(old);
        for(let p of parsed) { if(!p.status) p.status = 'active'; await dbSave('patients', p); }
        S.patients = await dbGetAll('patients');
        toast('🚚 Données migrées');
      } else {
        S.patients = defaultPatients();
        for(let p of S.patients) await dbSave('patients', p);
      }
    }
    
    // SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW error', e));
    }
    
    render();
  } catch(e) { toast('❌ Erreur DB'); }
}

async function save(){
  if(S.patientId) {
    const p = P(S.patientId);
    if(p) await dbSave('patients', p);
  } else {
    for(let p of S.patients) await dbSave('patients', p);
  }
}

// GESTION DES IMAGES BETA 2.0
let _imgTarget = null;
function openImageModal(target){
  _imgTarget = target;
  document.getElementById('modal-image').classList.add('open');
}
function closeImageModal(){
  document.getElementById('modal-image').classList.remove('open');
  _imgTarget = null;
}
function triggerCapture(source){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  if(source === 'camera') inp.capture='environment';
  
  inp.onchange=async()=>{
    if(inp.files[0]){
      const file = inp.files[0];
      closeImageModal();
      if(_imgTarget.type === 'id') {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const p=P(_imgTarget.pid); if(!p.idDocs) p.idDocs={};
          p.idDocs[_imgTarget.key] = e.target.result;
          await save(); render(); toast('📸 '+_imgTarget.label+' enregistré');
        };
        reader.readAsDataURL(file);
      } else {
        const fileId = await standardizeToPdf(file, _imgTarget.label, _imgTarget.pid, _imgTarget.did);
        const p=P(_imgTarget.pid); const d=p.docs.find(x=>x.id==_imgTarget.did);
        d.pdfId = fileId;
        await save(); render(); toast('📸 Document standardisé');
      }
    }
  };
  inp.click();
}

async function standardizeToPdf(file, label, pid, did){
  toast('📄 Conversion PDF...');
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const imgData = e.target.result;
      const html = `<div style="padding:40px; text-align:center; font-family: sans-serif">
        <h1 style="font-size:20px; color: #1a9e7e">${label}</h1>
        <div style="margin: 20px 0; border: 1px solid #eee; padding: 10px">
           <img src="${imgData}" style="max-width:100%">
        </div>
        <p style="margin-top:20px; font-size:12px; color:#666">Standardisé le ${new Date().toLocaleString()}</p>
        <p style="font-size:10px; color:#999">SoinsMobile Beta 2.0</p>
      </div>`;
      const opt = { margin: 0, filename: 'temp.pdf', image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 1.5 }, jsPDF: { unit: 'mm', format: 'a4' } };
      const worker = html2pdf().set(opt).from(html);
      const pdfBlob = await worker.output('blob');
      const fileId = `file_${pid}_${did}_${Date.now()}`;
      await dbSave('files', { id: fileId, blob: pdfBlob, label, pid, did });
      resolve(fileId);
    };
    reader.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
const P=id=>S.patients.find(p=>p.id==id);
const ini=p=>(p.prenom[0]||'')+(p.nom[0]||'');
const fd=d=>{if(!d)return '';try{const[y,m,j]=d.split('-');return`${j}/${m}/${y}`}catch{return d}};
const fdt=dt=>{if(!dt)return '';try{const d=new Date(dt);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+'\n'+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}catch{return dt}};
const age=ddn=>{if(!ddn)return '';return Math.floor((Date.now()-new Date(ddn))/31557600000)+' ans'};
const now=()=>new Date().toISOString().slice(0,16);
const todayStr=()=>new Date().toISOString().split('T')[0];
const todayFr=()=>{const d=new Date();return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`};
const nowTime=()=>{const d=new Date();return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

function toast(msg,dur=2400){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}

function copy(txt,lbl){
  navigator.clipboard.writeText(txt).then(()=>toast('📋 '+lbl+' copié')).catch(()=>{
    const e=document.createElement('textarea');e.value=txt;document.body.appendChild(e);e.select();document.execCommand('copy');document.body.removeChild(e);toast('📋 '+lbl+' copié');
  });
}

let _cb=null;
function showConfirm(title,msg,okLabel,cb,okClass=''){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  const btn=document.getElementById('confirm-ok-btn');
  btn.textContent=okLabel||'OK';
  btn.className='confirm-ok'+(okClass?' '+okClass:'');
  _cb=cb;document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('open');_cb=null}
document.getElementById('confirm-ok-btn').onclick=()=>{if(_cb)_cb();closeConfirm()};
document.getElementById('confirm-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeConfirm()});

// ═══════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════
function selectUser(user){
  S.currentUser = user;
  S.page = 'home';
  render();
}

function render(){
  const a=document.getElementById('app');
  if(S.page==='login') a.innerHTML=renderLogin();
  else if(S.page==='home') a.innerHTML=renderHome();
  else if(S.page==='dossier') a.innerHTML=renderDossier();
  else if(S.page==='modeles') a.innerHTML=renderModeles();
  else if(S.page==='form') a.innerHTML=renderForm();
  else if(S.page==='data') a.innerHTML=renderData();
  else if(S.page==='ordonnancier') a.innerHTML=renderOrdonnancier();
}

// ═══════════════════════════════════════════════
// HOME

function renderHome(){
  const q=S.search.toLowerCase();
  const fil=S.patients.filter(p=>p.status===S.category && `${p.nom} ${p.prenom} ${p.notes||''} ${p.adresse||''}`.toLowerCase().includes(q));

    if(done.has(p.id))return;done.add(p.id);
    const partner=p.coupleWith?fil.find(x=>x.id===p.coupleWith):null;

  return `
  <div class="topbar">
    <div class="topbar-center" style="text-align:left">
      <div class="topbar-title">SoinsMobile <span style="font-size:10px;color:var(--text3);font-weight:400">v${VERSION}</span></div>

      <button class="tbtn ghost" onclick="go('data')" title="Données">⚙️</button>

    </div>
  </div>
  <div class="content anim">
    <div class="cat-toggle" style="gap:4px">
      <div class="cat-btn ${S.category==='active'?'active':''}" style="font-size:11px;padding:8px 4px;flex:1" onclick="S.category='active';render()">En cours</div>
      <div class="cat-btn ${S.category==='pds'?'active':''}" style="font-size:11px;padding:8px 4px;flex:1" onclick="S.category='pds';render()">Prises de sang</div>
      <div class="cat-btn ${S.category==='archived'?'active':''}" style="font-size:11px;padding:8px 4px;flex:1" onclick="S.category='archived';render()">Anciens</div>
    </div>
    <div class="stats-bar">
      <div class="stat-chip"><div class="val">${S.patients.filter(p=>p.status==='active'||p.status==='pds').length}</div><div class="lbl">Actifs</div></div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>

        oninput="S.search=this.value;render();const el=document.getElementById('si');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}">
    </div>
    <div class="section-label">${fil.length} patient${fil.length>1?'s':''}</div>
    <div class="patient-list">${html||'<div style="color:var(--text3);font-size:13px;text-align:center;padding:32px">Aucun résultat</div>'}</div>
  </div>`;
}

function pCard(p,ts){
  const seen=(p.seenDates||[]).includes(ts);
  return `<div class="patient-card${p.urgent?' urgent':''}${seen?' seen-today':''}" onclick="openD(${p.id})">
    <div class="patient-avatar" style="background:${p.color}22;color:${p.color}">${ini(p)}</div>
    <div class="patient-info">
      <div class="patient-name">${p.prenom} ${p.nom}</div>
      <div class="patient-meta">${age(p.ddn)} — ${p.medecin}</div>
      <div class="patient-meta" style="color:var(--text3)">${p.notes||''}</div>
    </div>
    <span class="badge${p.urgent?' badge-alert':seen?' badge-ok':''}">${p.urgent?'⚡':seen?'✓ Vu':''}</span>
  </div>`;
}

function renderDossier(){
  const p=P(S.patientId);if(!p)return '';
  const partner=p.coupleWith?P(p.coupleWith):null;
  const ts=todayStr();
  const seen=(p.seenDates||[]).includes(ts);
  const contacts=p.contacts||[];
  const idDocs=p.idDocs||{};

  // Rappels ordonnances
  const nowTs = new Date().getTime();
  const rappels = p.docs.filter(d => d.type === 'ordonnance' && d.expiryDate).map(o => {
    const diffDays = Math.ceil((new Date(o.expiryDate).getTime() - nowTs) / (1000 * 60 * 60 * 24));
    if(diffDays <= 20) return {id: o.id, days: diffDays};
    return null;
  }).filter(r => r !== null);

  return `
  <div class="topbar">
    <button class="topbar-back tbtn ghost" onclick="go('home')">←</button>
    <div class="topbar-center">
      <div class="topbar-title">${p.prenom} ${p.nom}</div>
      <div class="topbar-sub">${age(p.ddn)} · ${p.medecin}</div>
    </div>
    <div class="topbar-placeholder"></div>
  </div>
  <div class="content anim">

    ${rappels.length > 0 ? `
    <div style="background:rgba(224,82,82,0.1); border:1px solid var(--red); border-radius:12px; padding:12px; margin-bottom:14px; display:flex; align-items:center; gap:10px">
      <span style="font-size:20px">⚠️</span>
      <div style="flex:1">
        <div style="font-size:13px; font-weight:600; color:var(--red)">Renouvellement ordonnance</div>
        <div style="font-size:11px; color:var(--text2)">
          ${rappels.map(r => `L'ordonnance expire dans <strong>${r.days} jour${r.days > 1 ? 's' : ''}</strong> (J${r.days >= 0 ? '-' : '+'}${Math.abs(r.days)})`).join('<br>')}
        </div>
      </div>
    </div>` : ''}

    <div class="patient-header">
      <div class="ph-top">
        <div class="patient-avatar-lg" style="background:${p.color}22;color:${p.color}">${ini(p)}</div>
        <div class="ph-info" style="flex:1">
          <h2>${p.prenom} ${p.nom}</h2>
          <p>Né(e) le ${fd(p.ddn)}</p>
          ${p.adresse?`<p>📍 ${p.adresse}</p>`:''}
          <div class="patient-tags">
            <span class="tag">${p.medecin}</span>
            ${partner?`<span class="tag couple">💑 ${partner.prenom} ${partner.nom}</span>`:''}
            ${(p.notes||'').split(',').map(n=>n.trim()?`<span class="tag">${n.trim()}</span>`:'').join('')}
          </div>
        </div>
      </div>
      <div class="vu-bar"><button class="vu-btn ${seen?'is-seen':'not-seen'}" onclick="toggleVu(${p.id})">${seen?'✅ Vu aujourd\'hui':'⬜ Marquer comme vu'}</button></div>
      <div class="header-actions">
        <button class="btn-sm primary" onclick="openPModal(${p.id})">✏️ Modifier</button>
        <button class="btn-sm danger" onclick="confirmDel(${p.id})">🗑 Supprimer</button>
      </div>
    </div>

    <div class="section-label">Documents d'identité</div>
    <div class="id-docs-grid">
      ${ID_DOCS.map(d=>{
        const img = idDocs[d.key];
        return `<div class="id-doc-card${img?' has-photo':''}" onclick="openImageModal({type:'id', pid:${p.id}, key:'${d.key}', label:'${d.label}'})" style="position:relative; overflow:hidden">
          ${img ? `<img src="${img}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.3">` : ''}
          <span class="id-icon" style="position:relative; z-index:1">${d.icon}</span>
          <div class="id-label" style="position:relative; z-index:1">${d.label}</div>
          <div class="id-status" style="position:relative; z-index:1">${img?'✓ Photo enregistrée':'Appuyer pour photographier'}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-label">Contacts (${contacts.length})</div>
    <div class="contact-list">
      ${contacts.map(c=>cCard(c,p.id)).join('')}
      <button class="add-contact-btn" onclick="openCModal(${p.id})">＋ Ajouter un contact</button>
    </div>

    <div class="section-label">Documents médicaux (${p.docs.length})</div>
    <div class="docs-grid">
      ${p.docs.map(d=>`
        <div class="doc-card" onclick="openF(${p.id},${d.id})">
          <span class="doc-icon">${d.icon}</span>
          <div class="doc-name">${d.title || d.label} ${d.pdfId ? '📄' : ''}</div>
          <div class="doc-datetime">${fdt(d.datetime)}</div>
          <div class="trace-user">Par ${d.user || '?'}</div>
        </div>`).join('')}
      <div class="doc-card add-doc" onclick="S.patientId=${p.id};go('modeles')">
        <span style="font-size:24px;color:var(--accent)">＋</span>
        <div style="font-size:11px;color:var(--text2);margin-top:3px">Nouveau doc</div>
      </div>
    </div>
  </div>`;
}

function cCard(c,pid){
  return `<div class="contact-card">
    <div class="contact-top">
      <div><div class="contact-name">${c.nom}</div><div class="contact-role">${c.role||''}</div></div>
      <button class="btn-sm danger" style="padding:4px 9px;font-size:11px" onclick="delContact(${pid},${c.id})">✕</button>
    </div>
    <div class="contact-actions">
      ${c.tel?`<a class="contact-btn tel" href="tel:${c.tel.replace(/\s/g,'')}">📞 ${c.tel}</a><button class="contact-btn" onclick="copy('${c.tel}','Tél')" style="padding:6px 9px">📋</button>`:''}
      ${c.mail?`<a class="contact-btn mail" href="mailto:${c.mail}">✉️ ${c.mail}</a><button class="contact-btn" onclick="copy('${c.mail}','Mail')" style="padding:6px 9px">📋</button>`:''}
    </div>
  </div>`;
}

function renderModeles(){
  const ms=[
    {t:'tension',i:'🩺',l:'Fiche tension',d:'Tableau multi-mesures avec date auto'},
    {t:'glycemie',i:'🩸',l:'Fiche glycémie',d:'Mesures avant/après repas + insuline'},
    {t:'pansement',i:'🩹',l:'Fiche pansement / plaie',d:'Localisation, aspect, traitement'},
    {t:'labo',i:'🧪',l:'Document labo',d:'Analyse de sang et résultats'},
    {t:'consentement',i:'✍️',l:'Consentement',d:'Accord et signature patient'},
    {t:'ordonnance',i:'💊',l:'Ordonnance',d:'Photo standardisée PDF + rappel'},
    {t:'cr',i:'📋',l:'Compte rendu',d:'Notes libres structurées'},
  ];
  return `
  <div class="topbar">
    <button class="topbar-back tbtn ghost" onclick="go('dossier')">←</button>
    <div class="topbar-center"><div class="topbar-title">Modèles</div></div>
    <div class="topbar-placeholder"></div>
  </div>
  <div class="content anim">
    <div class="modele-grid">${ms.map(m=>`
      <div class="modele-item" onclick="createDoc('${m.t}')">
        <span class="modele-icon">${m.i}</span>
        <div class="modele-info"><h3>${m.l}</h3><p>${m.d}</p></div>
        <span class="modele-arrow">›</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderForm(){
  const p=P(S.patientId);const d=p&&p.docs.find(x=>x.id==S.docId);if(!d)return '';
  const fns={tension:fTension,glycemie:fGlycemie,pansement:fPansement,labo:fLabo,consentement:fConsentement,ordonnance:fOrdonnance,cr:fCR};
  return `
  <div class="topbar">
    <button class="topbar-back tbtn ghost" onclick="go('dossier')">←</button>
    <div class="topbar-center"><div class="topbar-title">${d.label}</div></div>
    <div class="topbar-actions"><button class="tbtn ghost" onclick="openPdf(${p.id},${d.id})" title="Exporter en PDF">📄</button></div>
  </div>
  <div class="content anim">
    <div class="form-header">
      <div class="form-title">${d.icon} ${d.label}</div>
      <div class="form-patient">${p.prenom} ${p.nom}</div>
      <div style="margin-top:10px">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:600">Date et heure</div>
        <input type="datetime-local" id="doc-dt" value="${d.datetime||now()}" class="datetime-input" oninput="autoSaveForm()">
      </div>
      <div class="trace-user" style="text-align:left; margin-top:8px">Auteur : <strong>${d.user || S.currentUser}</strong></div>
    </div>
    ${(fns[d.type]||fCR)(d,p)}
    <button class="save-btn" onclick="saveForm()">💾 Enregistrer & Fermer</button>
  </div>`;
}

function fTension(d){
  if(!d.entries)d.entries=[{date:todayFr(),heure:nowTime(),sys:'',dia:'',pouls:'',comment:'',user:S.currentUser}];
  return `<div class="form-section"><div class="form-section-title">Mesures</div>
    <div class="measure-table">
      <div class="mt-head mt-tension"><div class="mt-cell hdr">Date</div><div class="mt-cell hdr">Heure</div><div class="mt-cell hdr">Sys.</div><div class="mt-cell hdr">Dia.</div><div class="mt-cell hdr">Pouls</div></div>
      <div id="tension-rows">${d.entries.map((e,i)=>tensionRowHTML(e,i)).join('')}</div>
    </div>
    <button onclick="addTRow()" style="width:100%;margin-top:8px;padding:10px;background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;cursor:pointer">＋ Ajouter une ligne</button>
  </div>
  <div class="form-section"><div class="form-section-title">Observations</div><textarea class="field-textarea" id="obs-t" oninput="autoSaveForm()">${d.obs||''}</textarea></div>`;
}

function tensionRowHTML(e,i){
  return `<div class="mt-row mt-tension">
    <div class="mt-cell"><span class="dt-display">${e.date||todayFr()}</span></div>
    <div class="mt-cell"><input data-t="heure" data-i="${i}" value="${e.heure||''}" type="time" style="width:52px" oninput="autoSaveForm()"></div>
    <div class="mt-cell"><input data-t="sys" data-i="${i}" value="${e.sys||''}" type="number" oninput="autoSaveForm()"></div>
    <div class="mt-cell"><input data-t="dia" data-i="${i}" value="${e.dia||''}" type="number" oninput="autoSaveForm()"></div>
    <div class="mt-cell"><input data-t="pouls" data-i="${i}" value="${e.pouls||''}" type="number" oninput="autoSaveForm()"></div>
    <div class="tension-comment-row" id="t-com-row-${i}" style="display:${e.comment?'flex':'none'}; grid-column:1/-1; padding:4px 10px 8px">
      <input class="tension-comment-input" data-t="comment" data-i="${i}" value="${e.comment||''}" placeholder="Commentaire..." oninput="autoSaveForm()">
      <div class="trace-user">Par ${e.user || S.currentUser}</div>
    </div>
    <div style="grid-column:1/-1; display:flex; justify-content:flex-end; padding:2px 8px 6px">
       <button class="add-comment-btn" onclick="toggleTCom(${i})" style="font-size:10px; padding:2px 8px; border-radius:6px; background:var(--bg3); border:1px solid var(--border); color:var(--text3)">${e.comment?'💬':'＋ Com.'}</button>
    </div>
  </div>`;
}

function toggleTCom(i){const el=document.getElementById(`t-com-row-${i}`); if(el) el.style.display=el.style.display==='none'?'flex':'none'}

function fGlycemie(d){
  if(!d.entries)d.entries=[{date:todayFr(),heure:'07:00',avant:'',apres:'',user:S.currentUser},{date:todayFr(),heure:'12:00',avant:'',apres:'',user:S.currentUser}];
  return `<div class="form-section"><div class="form-section-title">Glycémies</div>
    <div class="measure-table">
      <div class="mt-head mt-glyc"><div class="mt-cell hdr">Date</div><div class="mt-cell hdr">Heure</div><div class="mt-cell hdr">Avant</div><div class="mt-cell hdr">Après</div></div>
      <div id="glyc-rows">${d.entries.map((e,i)=>glycRowHTML(e,i)).join('')}</div>
    </div>
    <button onclick="addGRow()" style="width:100%;margin-top:8px;padding:10px;background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;cursor:pointer">＋ Ajouter une ligne</button>
  </div>
  <div class="form-section"><div class="form-section-title">Insuline</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">Type</span><input class="field-input" id="ins-type" value="${d.insType||''}" oninput="autoSaveForm()"></div>
      <div class="field-row"><span class="field-label">Matin</span><input class="field-input" id="ins-mat" value="${d.insMat||''}" type="number" oninput="autoSaveForm()"> UI</div>
      <div class="field-row"><span class="field-label">Soir</span><input class="field-input" id="ins-soir" value="${d.insSoir||''}" type="number" oninput="autoSaveForm()"> UI</div>
    </div>
  </div>`;
}

function glycRowHTML(e,i){
  return `<div class="mt-row mt-glyc" style="position:relative">
    <div class="mt-cell"><span class="dt-display">${e.date||todayFr()}</span></div>
    <div class="mt-cell"><input data-t="heure" data-i="${i}" value="${e.heure||''}" type="time" style="width:52px" oninput="autoSaveForm()"></div>
    <div class="mt-cell"><input data-t="avant" data-i="${i}" value="${e.avant||''}" type="number" step="0.01" oninput="autoSaveForm()"></div>
    <div class="mt-cell"><input data-t="apres" data-i="${i}" value="${e.apres||''}" type="number" step="0.01" oninput="autoSaveForm()"></div>
    <div class="trace-user" style="position:absolute; bottom:2px; right:5px">${e.user || S.currentUser}</div>
  </div>`;
}

function fPansement(d){
  return `<div class="form-section"><div class="form-section-title">Description</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">Lieu</span><input class="field-input" id="f-loc" value="${d.localisation||''}" oninput="autoSaveForm()"></div>
      <div class="field-row"><span class="field-label">Taille</span><input class="field-input" id="f-taille" value="${d.taille||''}" oninput="autoSaveForm()"></div>
    </div>
  </div>
  <div class="form-section"><div class="form-section-title">Aspect</div><textarea class="field-textarea" id="f-aspect" oninput="autoSaveForm()">${d.aspect||''}</textarea></div>
  <div class="form-section"><div class="form-section-title">Photo (Standardisée PDF)</div>
    <div class="photo-zone" onclick="openImageModal({type:'doc', pid:S.patientId, did:S.docId, label:'Photo Pansement'})">
      <div class="photo-zone-icon">📸</div><div class="photo-zone-text">Ajouter une photo</div>
    </div>
    ${d.pdfId ? `<div style="font-size:11px; color:var(--accent2); text-align:center; margin-top:6px">✓ Document standardisé prêt</div>` : ''}
  </div>`;
}

function fLabo(d){
  return `<div class="form-section"><div class="form-section-title">Labo</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">Laboratoire</span><input class="field-input" id="f-labo" value="${d.laboratoire||''}" oninput="autoSaveForm()"></div>
    </div>
  </div>
  <div class="form-section"><div class="form-section-title">Résultats</div><textarea class="field-textarea" id="f-res" oninput="autoSaveForm()">${d.resultats||''}</textarea></div>
  <div class="form-section"><div class="form-section-title">Document (PDF)</div>
    <div class="photo-zone" onclick="openImageModal({type:'doc', pid:S.patientId, did:S.docId, label:'Document Labo'})">
      <div class="photo-zone-icon">📄</div><div class="photo-zone-text">Scanner le document</div>
    </div>
    ${d.pdfId ? `<div style="font-size:11px; color:var(--accent2); text-align:center; margin-top:6px">✓ Document standardisé prêt</div>` : ''}
  </div>`;
}

function fConsentement(d,p){
  return `<div class="form-section"><div class="form-section-title">Acte</div><textarea class="field-textarea" id="f-acte" oninput="autoSaveForm()">${d.acte||''}</textarea></div>
  <div class="form-section"><div class="form-section-title">Signature (PDF)</div>
    <div class="photo-zone" onclick="openImageModal({type:'doc', pid:p.id, did:d.id, label:'Signature Consentement'})">
      <div class="photo-zone-icon">✍️</div><div class="photo-zone-text">Photographier signature</div>
    </div>
    ${d.pdfId ? `<div style="font-size:11px; color:var(--accent2); text-align:center; margin-top:6px">✓ Signature enregistrée</div>` : ''}
  </div>`;
}

function fOrdonnance(d){
  if(!d.expiryDate){ const dt=new Date(); dt.setMonth(dt.getMonth()+3); d.expiryDate=dt.toISOString().split('T')[0] }
  return `<div class="form-section"><div class="form-section-title">Objet & Rappel</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">Titre</span><input class="field-input" id="f-title" value="${d.title||''}" oninput="autoSaveForm()"></div>
      <div class="field-row"><span class="field-label">Expire le</span><input class="field-input" id="f-expiry" value="${d.expiryDate}" type="date" oninput="autoSaveForm()"></div>
    </div>
  </div>
  <div class="form-section"><div class="form-section-title">Photo (PDF)</div>
    <div class="photo-zone" onclick="openImageModal({type:'doc', pid:S.patientId, did:S.docId, label:'Photo Ordonnance'})">
      <div class="photo-zone-icon">💊</div><div class="photo-zone-text">Scanner l'ordonnance</div>
    </div>
    ${d.pdfId ? `<div style="font-size:11px; color:var(--accent2); text-align:center; margin-top:6px">✓ Ordonnance standardisée</div>` : ''}
  </div>
  <div class="form-section"><div class="form-section-title">Résumé manuel</div><textarea class="field-textarea" id="f-medocs" oninput="autoSaveForm()">${d.medicaments||''}</textarea></div>`;
}

function fCR(d){
  return `<div class="form-section"><div class="form-section-title">Contenu</div><textarea class="field-textarea" id="f-cr" oninput="autoSaveForm()">${d.texte||''}</textarea></div>
  <div class="form-section"><div class="form-section-title">Scan (PDF)</div>
    <div class="photo-zone" onclick="openImageModal({type:'doc', pid:S.patientId, did:S.docId, label:'Scan Compte-Rendu'})">
      <div class="photo-zone-icon">📋</div><div class="photo-zone-text">Scanner le compte-rendu</div>
    </div>
    ${d.pdfId ? `<div style="font-size:11px; color:var(--accent2); text-align:center; margin-top:6px">✓ Scan prêt</div>` : ''}
  </div>`;
}

function openPdf(pid, did){
  const p=P(pid); const d=p.docs.find(x=>x.id==did);
  const cont=document.getElementById('pdf-content');
  let html = `
    <div class="pdf-header"><div class="pdf-title">${d.label}</div><div class="pdf-subtitle">Dossier Médical Partagé</div><div class="pdf-patient">${p.prenom} ${p.nom.toUpperCase()}</div></div>
    <div style="margin-bottom:20px; font-size:13px"><strong>Date :</strong> ${fdt(d.datetime)}<br><strong>Médecin :</strong> ${p.medecin}<br><strong>Auteur :</strong> ${d.user || S.currentUser}</div>`;

  if(d.type==='tension'){
    html += `<table class="pdf-table"><thead><tr><th>Date</th><th>Heure</th><th>Sys</th><th>Dia</th><th>Pouls</th><th>Auteur</th></tr></thead><tbody>
      ${d.entries.map(e=>`<tr><td>${e.date}</td><td>${e.heure}</td><td><strong>${e.sys}</strong></td><td><strong>${e.dia}</strong></td><td>${e.pouls}</td><td style="font-size:9px">${e.user || d.user || '?'}</td></tr>${e.comment?`<tr><td colspan="6" class="comment">↳ ${e.comment}</td></tr>`:''}`).join('')}
    </tbody></table>`;
  } else if(d.type==='glycemie'){
    html += `<table class="pdf-table"><thead><tr><th>Date</th><th>Heure</th><th>Av.</th><th>Ap.</th><th>Auteur</th></tr></thead><tbody>
      ${d.entries.map(e=>`<tr><td>${e.date}</td><td>${e.heure}</td><td>${e.avant}</td><td>${e.apres}</td><td style="font-size:9px">${e.user || d.user || '?'}</td></tr>`).join('')}
    </tbody></table>`;
  } else if(d.type==='ordonnance'){
    html += `<div style="font-size:13px"><p><strong>Titre :</strong> ${d.title || '/'}</p><p><strong>Valable jusqu'au :</strong> ${fd(d.expiryDate)}</p>
    <div style="margin-top:15px; padding:15px; border:1px solid #eee; background:#fafafa; border-radius:8px"><strong>Résumé :</strong><br>${(d.medicaments||'').replace(/\n/g,'<br>')}</div></div>`;
  } else if(d.type==='labo'){
    html += `<div style="font-size:13px"><p><strong>Laboratoire :</strong> ${d.laboratoire||'/'}</p><div style="margin-top:15px; padding:15px; border:1px solid #eee; background:#fafafa; border-radius:8px"><strong>Résultats :</strong><br>${(d.resultats||'').replace(/\n/g,'<br>')}</div></div>`;
  }
  html += `<div class="pdf-footer">Document confidentiel</div>`;
  cont.innerHTML = html;
  document.getElementById('pdf-overlay').classList.add('open');
}

function closePdf(){ document.getElementById('pdf-overlay').classList.remove('open') }

function downloadPdf(){
  const p=P(S.patientId); const d=p.docs.find(x=>x.id==S.docId);
  const opt={ margin:10, filename:`Soins_${p.nom}_${d.label}.pdf`, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4'} };
  html2pdf().set(opt).from(document.getElementById('pdf-content')).save();
  toast('💾 Téléchargement lancé');
}

function renderOrdonnancier(){
  const ordos=[]; S.patients.forEach(p=>{ p.docs.filter(d=>d.type==='ordonnance').forEach(o=>ordos.push({p,o})) });
  ordos.sort((a,b)=>new Date(b.o.datetime)-new Date(a.o.datetime));
  return `
  <div class="topbar"><button class="topbar-back tbtn ghost" onclick="go('home')">←</button><div class="topbar-center"><div class="topbar-title">Ordonnancier</div></div><div class="topbar-placeholder"></div></div>
  <div class="content anim">
    <div class="section-label">${ordos.length} ordonnance(s)</div>
    <div class="patient-list">
      ${ordos.map(i=>{
        const diff=Math.ceil((new Date(i.o.expiryDate).getTime()-new Date().getTime())/(86400000));
        const exp=diff<0;
        return `<div class="patient-card" style="border-left:3px solid ${exp?'var(--red)':diff<=20?'var(--amber)':'transparent'}" onclick="openF(${i.p.id},${i.o.id})">
          <div class="patient-avatar" style="background:var(--bg3);color:var(--text2)">💊</div>
          <div class="patient-info"><div class="patient-name">${i.o.title||'Sans titre'}</div><div class="patient-meta" style="color:var(--accent2)">${i.p.prenom} ${i.p.nom}</div></div>
          <div style="font-size:10px;text-align:right"><div style="color:${exp?'var(--red)':'var(--text3)'};font-weight:${exp?700:400}">${exp?'🔴 EXPIRÉ':fd(i.o.expiryDate)}</div>${!exp&&diff<=20?`<div style="color:var(--amber);font-weight:600">🟠 J-${diff}</div>`:''}</div>
        </div>`}).join('')}
    </div>
  </div>`;
}

function renderData(){
  const ts=new Date().toLocaleString('fr-FR');
  return `
  <div class="topbar"><button class="topbar-back tbtn ghost" onclick="go('home')">←</button><div class="topbar-center"><div class="topbar-title">Données</div></div><div class="topbar-placeholder"></div></div>
  <div class="content anim">
    <div class="data-panel"><h3>👤 Profil</h3><p>Connectée : <strong>${S.currentUser}</strong></p><button class="data-btn" style="background:var(--bg3)" onclick="go('login')">🔄 Changer</button></div>
    <div class="data-panel"><h3>📤 Export</h3><p>Sauvegarde globale sécurisée.</p><button class="data-btn export-btn" onclick="exportData()"><span class="data-btn-icon">⬇️</span><strong>Exporter tout</strong></button></div>
    <div class="data-panel"><h3>📥 Import</h3><button class="data-btn import-btn" onclick="importDataMerge()"><span class="data-btn-icon">⬆️</span><strong>Fusionner</strong></button></div>
    <div class="data-panel"><h3>🗑 Réinitialiser</h3><button class="data-btn danger-btn" onclick="confirmReset()"><span class="data-btn-icon">⚠️</span><strong>Tout effacer</strong></button></div>
  </div>`;
}

async function saveForm(silent=false){
  const p=P(S.patientId); const d=p.docs.find(x=>x.id==S.docId); if(!d)return;
  const dt=document.getElementById('doc-dt'); if(dt)d.datetime=dt.value;
  if(d.type==='tension'||d.type==='glycemie'){
    const rows=collectRows(); Object.keys(rows).forEach(i=>{ if(d.entries[i]) Object.assign(d.entries[i],rows[i]); else {d.entries[i]=rows[i]; d.entries[i].user=S.currentUser} });
    if(d.type==='tension'){const o=document.getElementById('obs-t'); if(o)d.obs=o.value}
    else { ['ins-type','ins-mat','ins-soir'].forEach(id=>{const el=document.getElementById(id); if(el)d[id.replace('ins-','ins')]=el.value}) }
  } else if(d.type==='pansement'){ ['f-loc','f-taille','f-aspect','f-trait'].forEach(id=>{const el=document.getElementById(id); if(el)d[id.replace('f-','localisation').replace('taille','taille').replace('aspect','aspect').replace('trait','traitement')]=el.value})
  } else if(d.type==='labo'){ ['f-labo','f-res'].forEach(id=>{const el=document.getElementById(id); if(el)d[id.replace('f-','').replace('labo','laboratoire').replace('res','resultats')]=el.value})
  } else if(d.type==='consentement'){const fa=document.getElementById('f-acte'); if(fa)d.acte=fa.value;
  } else if(d.type==='ordonnance'){ ['f-title','f-expiry','f-medocs'].forEach(id=>{const el=document.getElementById(id); if(el)d[id.replace('f-','').replace('title','title').replace('expiry','expiryDate').replace('medocs','medicaments')]=el.value})
  } else if(d.type==='cr'){const ft=document.getElementById('f-cr'); if(ft)d.texte=ft.value}
  await save(); if(!silent){ toast('✓ Enregistré'); setTimeout(()=>{go('dossier')},600) }
}

function collectRows(){ const rows={}; document.querySelectorAll('[data-t]').forEach(inp=>{ const i=parseInt(inp.dataset.i),t=inp.dataset.t; if(!rows[i])rows[i]={}; rows[i][t]=inp.value }); return rows }
function addTRow(){ const p=P(S.patientId); const d=p.docs.find(x=>x.id==S.docId); const rows=collectRows(); Object.keys(rows).forEach(i=>{if(d.entries[i])Object.assign(d.entries[i],rows[i])}); d.entries.push({date:todayFr(),heure:nowTime(),sys:'',dia:'',pouls:'',comment:'',user:S.currentUser}); save(); const container=document.getElementById('tension-rows'); if(container){const i=d.entries.length-1; container.insertAdjacentHTML('beforeend',tensionRowHTML(d.entries[i],i))} }
function addGRow(){ const p=P(S.patientId); const d=p.docs.find(x=>x.id==S.docId); const rows=collectRows(); Object.keys(rows).forEach(i=>{if(d.entries[i])Object.assign(d.entries[i],rows[i])}); d.entries.push({date:todayFr(),heure:'',avant:'',apres:'',user:S.currentUser}); save(); const container=document.getElementById('glyc-rows'); if(container){const i=d.entries.length-1; container.insertAdjacentHTML('beforeend',glycRowHTML(d.entries[i],i))} }
function autoSaveForm(){ saveForm(true) }

function exportData(){ const blob=new Blob([JSON.stringify({v:VERSION,data:S.patients},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`Soins_Export_${todayStr()}.soins`; a.click(); toast('✅ Export terminé') }
function importDataMerge(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.soins,.json'; inp.onchange=()=>{ if(!inp.files[0])return; const r=new FileReader(); r.onload=async e=>{ try{ const data=JSON.parse(e.target.result); const toImp=data.data||data; for(let i of toImp){ const ex=S.patients.some(p=>p.nom===i.nom&&p.prenom===i.prenom); if(!ex){ i.id=Date.now()+Math.random(); S.patients.push(i); await dbSave('patients',i) } } render(); toast('✅ Fusion terminée') }catch(e){toast('❌ Fichier invalide')} }; r.readAsText(inp.files[0]) }; inp.click() }
function confirmReset(){ showConfirm('⚠️ Tout effacer','Action irréversible.','Confirmer',()=>{ S.patients=[]; const tx=db.transaction(['patients','files'],'readwrite'); tx.objectStore('patients').clear(); tx.objectStore('files').clear(); location.reload() }) }

function go(p){S.page=p;render();window.scrollTo(0,0)}
function openD(id){S.patientId=id;S.page='dossier';render()}
function openF(pid,did){S.patientId=pid;S.docId=did;S.page='form';render()}
function toggleVu(pid){ const p=P(pid); if(!p)return; if(!p.seenDates)p.seenDates=[]; const ts=todayStr(); const idx=p.seenDates.indexOf(ts); if(idx>=0)p.seenDates.splice(idx,1); else p.seenDates.push(ts); save(); render() }

// Init
startApp();
</script>
</body>
</html>
