<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a9e7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Soins Infirmiers V1</title>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('SW Registered');
      // Vérifie si une mise à jour est en attente
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // Une nouvelle version est là, le skipWaiting() dans le SW va déclencher controllerchange
            console.log('Nouvelle version détectée');
          }
        });
      });
    }).catch(err => console.log('SW Error', err));
  });

  // Force le rechargement quand le nouveau SW prend le contrôle
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<!-- PATIENT MODAL -->
<div class="modal-overlay" id="modal-patient">
  <div class="modal">
    <div class="modal-title" id="mp-title">Dossier Patient</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="modal-field"><label>Prénom</label><input class="modal-input" id="np-prenom"></div>
      <div class="modal-field"><label>Nom</label><input class="modal-input" id="np-nom"></div>
    </div>
    <div class="modal-field"><label>DDN</label><input class="modal-input" id="np-ddn" type="date"></div>
    <div class="modal-field"><label>Médecin</label><input class="modal-input" id="np-medecin"></div>
    <div class="modal-field"><label>Adresse</label><input class="modal-input" id="np-adresse"></div>
    <div class="modal-field"><label>Notes</label><input class="modal-input" id="np-notes"></div>
    <div class="modal-field"><label>Lier à (Couple)</label><select class="modal-select" id="np-couple"></select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="modal-field"><label>Urgence</label><select class="modal-select" id="np-urgent"><option value="">Non</option><option value="1">Oui</option></select></div>
      <div class="modal-field"><label>Statut</label><select class="modal-select" id="np-status"><option value="active">Actif</option><option value="pds">PDS</option><option value="archived">Ancien</option></select></div>
    </div>
    <button class="modal-btn" onclick="core.savePatient()">Valider</button>
    <button class="modal-btn" onclick="ui.closeModal('modal-patient')" style="background:transparent;color:var(--text3)">Annuler</button>
  </div>
</div>

<!-- CONTACT MODAL -->
<div class="modal-overlay" id="modal-contact">
  <div class="modal">
    <div class="modal-title">Nouveau Contact</div>
    <div class="modal-field"><label>Nom / Relation</label><input class="modal-input" id="c-nom" placeholder="ex: Fils, Voisin..."></div>
    <div class="modal-field"><label>Téléphone</label><input class="modal-input" id="c-tel" type="tel"></div>
    <div class="modal-field"><label>Email</label><input class="modal-input" id="c-mail" type="email"></div>
    <button class="modal-btn" onclick="core.saveContact()">Enregistrer</button>
    <button class="modal-btn" onclick="ui.closeModal('modal-contact')" style="background:transparent;color:var(--text3)">Annuler</button>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/forms.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
